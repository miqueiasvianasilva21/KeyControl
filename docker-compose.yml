services:
  db:
    image: postgres:15-alpine
    container_name: postgres_chaves
    restart: unless-stopped
    environment:
      TZ: America/Manaus
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-db_chaves}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend_chaves
    restart: unless-stopped
    command: pm2-runtime start ecosystem.config.cjs
    expose:
      - "3000"
    environment:
      TZ: America/Manaus
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:adminpassword@db:5432/db_chaves?schema=public}
      JWT_SECRET: ${JWT_SECRET:-k8s_keycontrol_prod_jwt_secret_98a4b3c2d1e0f9}
      NODE_ENV: ${NODE_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-AdminUfam@2026SecurePass}
      PM2_INSTANCES: ${BACKEND_PM2_INSTANCES:-1}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: frontend_chaves
    restart: unless-stopped
    command: pm2-runtime start ecosystem.config.cjs
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      TZ: America/Manaus
      PORT: 80
      BACKEND_URL: http://backend:3000
      NODE_ENV: ${NODE_ENV:-production}
      PM2_INSTANCES: ${FRONTEND_PM2_INSTANCES:-1}
    depends_on:
      - backend

volumes:
  pgdata:
