
services:
  db:
    image: postgres:15-alpine
    container_name: postgres_chaves
    restart: always
    environment:
      TZ: America/Manaus
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-db_chaves}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend_chaves
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      TZ: America/Manaus
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:adminpassword@db:5432/db_chaves?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://${APP_HOST:-localhost}:${FRONTEND_PORT:-5173}}
      FRONTEND_URL: ${FRONTEND_URL:-http://${APP_HOST:-localhost}:${FRONTEND_PORT:-5173}}
    depends_on:
      - db

  frontend:
    build: ./frontend 
    container_name: frontend_chaves
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${BACKEND_URL:-http://${APP_HOST:-localhost}:${BACKEND_PORT:-3000}}
    depends_on:
      - backend

volumes:
  pgdata:
